<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Service English">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Service English 100</title>
<meta name="description" content="3000 English words for sales assistants and cabin crew, with Uzbek translations. 30 words a day for 100 days. Works offline.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314213d'/%3E%3Cpath d='M18 44 L32 16 L46 44' stroke='%23c9a26b' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M24 34 H40' stroke='%23c9a26b' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f2ea; --bg2:#efe8db; --surface:#ffffff; --surface2:#faf7f1;
  --ink:#1a1f2e; --ink2:#3a4154; --muted:#7a7f8c; --line:#e5dccb;
  --navy:#14213d; --gold:#b8925a; --gold2:#d9bb87; --goldsoft:#f3e8d4;
  --good:#2f7d5b; --goodsoft:#e2f1e9; --bad:#b4453a; --badsoft:#f8e3e0;
  --star:#c28a1e; --shadow:0 1px 2px rgba(20,33,61,.06),0 8px 24px rgba(20,33,61,.07);
  --radius:18px;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1322; --bg2:#141b2e; --surface:#182036; --surface2:#1c2540;
    --ink:#f1ece2; --ink2:#cfd3de; --muted:#8e95a8; --line:#2a3452;
    --navy:#0a1020; --gold:#d4b07a; --gold2:#e6c999; --goldsoft:#2b2a2a;
    --good:#5cc495; --goodsoft:#173a2e; --bad:#ec7b6e; --badsoft:#3d2022;
    --star:#f0b84a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1322; --bg2:#141b2e; --surface:#182036; --surface2:#1c2540;
  --ink:#f1ece2; --ink2:#cfd3de; --muted:#8e95a8; --line:#2a3452;
  --navy:#0a1020; --gold:#d4b07a; --gold2:#e6c999; --goldsoft:#2b2a2a;
  --good:#5cc495; --goodsoft:#173a2e; --bad:#ec7b6e; --badsoft:#3d2022;
  --star:#f0b84a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--navy);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(201,162,107,.4)}
.brand b{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.brand b span{color:var(--gold)}
.nav{display:flex;gap:4px}
.nav a{display:flex;align-items:center;gap:6px;white-space:nowrap;padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--ink2);font-size:14px;font-weight:500}
.nav a:hover{background:var(--bg2)}
.nav a.on{background:var(--navy);color:#f3e6cf}
:root[data-theme="dark"] .nav a.on{background:var(--gold);color:#14213d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav a.on{background:var(--gold);color:#14213d}}
.nav svg{width:18px;height:18px}
@media (max-width:820px){
  .nav{position:fixed;bottom:0;left:0;right:0;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
  .nav a{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;border-radius:12px}
  .nav a.on{background:var(--goldsoft);color:var(--ink)}
  body{padding-bottom:76px}
  .brand b{font-size:18px}
}

main{padding:28px 0 48px}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.1px;margin:0}
h1{font-size:clamp(28px,5vw,42px);line-height:1.1}
h2{font-size:24px}
h3{font-size:18px}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;text-decoration:none;transition:transform .08s ease,background .15s}
.btn:hover{background:var(--surface2)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#f3e6cf}
.btn.primary:hover{background:#1d2d52}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));border-color:transparent;color:#1a1f2e}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn svg{width:18px;height:18px}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);flex:none}
.icon-btn:hover{background:var(--bg2)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.on-good{background:var(--goodsoft);border-color:var(--good);color:var(--good)}
.icon-btn.on-star{background:var(--goldsoft);border-color:var(--star);color:var(--star)}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:24px;background:radial-gradient(120% 140% at 100% 0%,#2a3b66 0%,#14213d 55%,#0d1529 100%);color:#f3ecdf;padding:32px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
.hero:after{content:"";position:absolute;inset:auto -60px -80px auto;width:260px;height:260px;border-radius:50%;border:1px solid rgba(217,187,135,.25)}
.hero:before{content:"";position:absolute;inset:-90px auto auto -40px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(217,187,135,.15)}
.hero h1{color:#fff}
.hero h1 em{font-style:italic;color:var(--gold2)}
.hero p{color:#c9cfdd;max-width:520px;margin:10px 0 20px}
.hero .eyebrow{color:var(--gold2)}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .lbl b{display:block;font-family:var(--serif);font-size:32px;line-height:1;color:#fff}
.ring .lbl small{color:#c9cfdd;font-size:12px}
@media (max-width:640px){.hero{grid-template-columns:1fr;padding:24px}.ring{width:120px;height:120px;justify-self:start}.ring svg{width:120px;height:120px}}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0 28px}
.stat{padding:16px}
.stat b{display:block;font-family:var(--serif);font-size:28px;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}

.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:8px 0 14px;flex-wrap:wrap}

/* Day grid */
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.day{position:relative;padding:14px;text-decoration:none;display:flex;flex-direction:column;gap:6px;min-height:118px;transition:transform .12s ease,border-color .12s}
.day:hover{transform:translateY(-2px);border-color:var(--gold)}
.day .num{font-family:var(--serif);font-size:26px;line-height:1;font-weight:600}
.day .num small{font-family:var(--sans);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px;font-weight:600}
.day .th{font-size:12.5px;color:var(--ink2);line-height:1.3;flex:1}
.bar{height:6px;border-radius:99px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px}
.day.done{background:linear-gradient(160deg,var(--surface) 40%,var(--goldsoft))}
.day .badge{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center}
.day .badge svg{width:13px;height:13px}
.day.next{outline:2px solid var(--gold);outline-offset:2px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500}
.chip.on{background:var(--navy);border-color:var(--navy);color:#f3e6cf}

/* Theme roadmap */
.road{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.road .r{padding:12px 14px;display:flex;gap:12px;align-items:center;text-decoration:none}
.road .r .dot{width:38px;height:38px;border-radius:12px;background:var(--goldsoft);display:grid;place-items:center;font-family:var(--serif);font-weight:700;color:var(--gold);flex:none;font-size:14px}
.road .r b{display:block;font-size:14px}
.road .r span{font-size:12px;color:var(--muted)}

/* Day page */
.dayhead{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.crumbs{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.crumbs a{font-size:13px;color:var(--muted);text-decoration:none}
.crumbs a:hover{color:var(--ink)}
.tabs{display:flex;gap:4px;background:var(--bg2);padding:4px;border-radius:14px;margin:0 0 20px;overflow-x:auto}
.tabs a{flex:1;text-align:center;padding:9px 14px;border-radius:10px;text-decoration:none;font-weight:600;font-size:14px;color:var(--ink2);white-space:nowrap}
.tabs a.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.pager{display:flex;gap:8px}

.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.word{padding:18px;display:flex;flex-direction:column;gap:8px;position:relative}
.word.known{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.word .row{display:flex;align-items:center;gap:10px}
.word .idx{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;width:22px}
.word .en{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.2;flex:1;word-break:break-word}
.pos{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);background:var(--goldsoft);padding:2px 8px;border-radius:99px}
.uz{font-size:16px;font-weight:600;color:var(--good)}
.uz.hidden{color:transparent;background:var(--bg2);border-radius:6px;cursor:pointer;user-select:none}
.uz.hidden:after{content:"tap to reveal";color:var(--muted);font-weight:500;font-size:12px;position:absolute;margin-left:-80px}
.def{color:var(--ink2);font-size:14.5px}
.ex{font-size:14.5px;font-style:italic;color:var(--ink2);border-left:3px solid var(--gold2);padding-left:10px}
.ex mark{background:none;color:var(--ink);font-weight:700;font-style:normal}
.word .acts{display:flex;gap:6px;margin-top:4px}

/* Flashcards */
.fc-wrap{max-width:620px;margin:0 auto}
.fc-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px;color:var(--muted);gap:8px;flex-wrap:wrap}
.flip{perspective:1400px;height:340px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.flip-in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}
.face.front{background:radial-gradient(120% 120% at 0% 0%,#24355e 0%,#14213d 60%);color:#fff}
.face.front .big{font-family:var(--serif);font-size:clamp(28px,6vw,44px);font-weight:600;line-height:1.15}
.face.front .pos{background:rgba(217,187,135,.18);color:var(--gold2)}
.face.front .hint{position:absolute;bottom:16px;font-size:12px;color:#9aa3b8}
.face.back{transform:rotateY(180deg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.face.back .uzbig{font-size:clamp(22px,4.5vw,30px);font-weight:700;color:var(--good)}
.face.back .def{font-size:16px}
.face.back .ex{text-align:left;font-size:15px}
.fc-acts{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.fc-acts .btn{min-width:130px}
.kbd{font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid currentColor;opacity:.7;font-weight:500}
.progress-dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.progress-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.progress-dots i.k{background:var(--good)}
.progress-dots i.h{background:var(--star)}
.progress-dots i.c{outline:2px solid var(--gold);outline-offset:1px}

/* Quiz */
.quiz{max-width:640px;margin:0 auto}
.qcard{padding:28px}
.qtype{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.qprompt{font-family:var(--serif);font-size:clamp(22px,4.5vw,30px);font-weight:600;margin:10px 0 4px;line-height:1.25}
.qprompt.small{font-family:var(--sans);font-size:18px;font-weight:500}
.opts{display:grid;gap:10px;margin-top:20px}
.opt{text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface2);font-size:16px;display:flex;gap:12px;align-items:center}
.opt:hover:not([disabled]){border-color:var(--gold)}
.opt .k{width:26px;height:26px;border-radius:8px;background:var(--bg2);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.opt.right{border-color:var(--good);background:var(--goodsoft)}
.opt.wrong{border-color:var(--bad);background:var(--badsoft)}
.opt[disabled]{cursor:default}
.qbar{height:6px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-bottom:14px}
.qbar i{display:block;height:100%;background:var(--navy);transition:width .3s}
.feedback{margin-top:16px;padding:14px;border-radius:12px;background:var(--bg2);font-size:14.5px}
.result{text-align:center;padding:36px 24px}
.result .score{font-family:var(--serif);font-size:64px;line-height:1;font-weight:700;color:var(--gold)}
.missed{margin-top:22px;text-align:left;display:grid;gap:8px}
.missed div{padding:10px 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:14px}

/* Spelling */
.spell input{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface2);font-size:20px;font-family:var(--serif);outline:none}
.spell input:focus{border-color:var(--gold)}
.spell input.right{border-color:var(--good);background:var(--goodsoft)}
.spell input.wrong{border-color:var(--bad);background:var(--badsoft)}

/* Search / settings */
.search{display:flex;gap:10px;align-items:center;padding:6px 6px 6px 16px;margin-bottom:16px}
.search input{flex:1;border:0;background:transparent;font-size:17px;padding:8px 0;outline:none;min-width:0}
.list{display:grid;gap:8px}
.li{display:flex;gap:12px;align-items:center;padding:12px 14px}
.li .en{font-family:var(--serif);font-weight:600;font-size:17px}
.li .meta{flex:1;min-width:0}
.li .meta div{font-size:13.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis}
.li .daylink{font-size:12px;font-weight:600;color:var(--gold);text-decoration:none;white-space:nowrap}
.setting{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line)}
.setting:last-child{border-bottom:0}
.setting b{display:block;font-size:15px}
.setting span{font-size:13px;color:var(--muted)}
.setting select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface2)}
.switch{position:relative;width:46px;height:26px;border-radius:99px;background:var(--line);border:0;flex:none;transition:background .15s}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--good)}
.switch.on:after{left:23px}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#f3e6cf;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:720px){.toast{bottom:90px}}
.footer{text-align:center;color:var(--muted);font-size:12.5px;padding:24px 0 8px}
.mt{margin-top:28px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 10px;border-radius:99px;background:var(--bg2);color:var(--ink2)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/">
      <span class="logo"><svg width="22" height="22" viewBox="0 0 64 64"><path d="M18 46 L32 16 L46 46" stroke="#c9a26b" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 35 H40" stroke="#c9a26b" stroke-width="5" stroke-linecap="round"/></svg></span>
      <b>Service English <span>100</span></b>
    </a>
    <nav class="nav" id="nav">
      <a href="#/" data-r="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Home</a>
      <a href="#/days" data-r="days"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>100 Days</a>
      <a href="#/review" data-r="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Review</a>
      <a href="#/search" data-r="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Search</a>
      <a href="#/settings" data-r="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Settings</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>

<script>

const WPD = 30;

/* ---------- Data ---------- */
const DAYS = DATA.days;
const ALL = [];
DAYS.forEach((d, di) => d.words.forEach((w, i) => {
  ALL.push({ id: di * WPD + i, day: d.n, w: w[0], pos: w[1], uz: w[2], def: w[3], ex: w[4] });
}));
const dayWords = n => ALL.slice((n - 1) * WPD, n * WPD);

/* ---------- State ----------
   Always saved in this browser. On the claude.ai link, progress is also kept in the
   viewer's private space in the artifact's db, so it follows them between phone and
   computer. Settings (voice, theme…) stay per device. */
const KEY = 'se100-v1';
const DEFAULT = { known: {}, hard: {}, done: {}, best: {}, streak: { last: null, count: 0 }, active: {}, updatedAt: 0,
  settings: { showUz: true, recorded: true, accent: 'en-GB', voice: '', rate: 0.9, theme: 'auto', uzFirst: false } };
const PROGRESS = ['known', 'hard', 'done', 'best', 'streak', 'active', 'updatedAt'];
let S = load();
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const s = JSON.parse(raw); return { ...DEFAULT, ...s, settings: { ...DEFAULT.settings, ...(s.settings || {}) } }; }
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT));
}
const progressJSON = () => JSON.stringify([S.known, S.hard, S.done, S.best, S.streak, S.active]);
let lastProgress = progressJSON();
function save() {
  const pj = progressJSON();
  if (pj !== lastProgress) { lastProgress = pj; S.updatedAt = Date.now(); queueSync(); }
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}

/* Account sync (claude.ai only; absent when the file is opened from disk) */
const sync = { ref: null, busy: false, again: false, timer: null, on: false };
const progressOf = s => { const p = {}; PROGRESS.forEach(k => p[k] = s[k]); return p; };
function queueSync() { if (!sync.ref) return; clearTimeout(sync.timer); sync.timer = setTimeout(pushRemote, 1200); }
async function pushRemote(retried) {
  if (!sync.ref) return;
  if (sync.busy) { sync.again = true; return; }   // one write at a time
  sync.busy = true;
  try { await sync.ref.set(progressOf(S)); sync.on = true; }
  catch (e) {
    if (e && e.code === 'unavailable' && !retried) { sync.busy = false; setTimeout(() => pushRemote(true), 1500 + Math.random() * 1500); return; }
    if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) { sync.ref = null; sync.on = false; }
  }
  sync.busy = false;
  if (sync.again) { sync.again = false; pushRemote(); }
}
function adopt(r) {
  PROGRESS.forEach(k => { if (r[k] !== undefined) S[k] = JSON.parse(JSON.stringify(r[k])); });
  lastProgress = progressJSON();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}
function refreshIfIdle() {   // never interrupt a quiz or flashcard run
  const h = location.hash;
  if (!h || h === '#/' || h === '#/days' || h === '#/settings' || /^#\/day\/\d+$/.test(h)) route();
}
async function initSync() {
  if (!window.claude || typeof claude.use !== 'function') return;
  const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  if (!db || !user) return;
  const uid = await user.id();
  if (!uid) return;
  const ref = db.doc('data/users/' + uid + '/progress');
  let snap;
  try { snap = await ref.get(); } catch (e) { return; }
  sync.ref = ref; sync.on = true;
  const remote = snap.exists ? snap.data() : null;
  if (remote && (remote.updatedAt || 0) > (S.updatedAt || 0)) { adopt(remote); refreshIfIdle(); }
  else if (!remote || (S.updatedAt || 0) > (remote.updatedAt || 0)) pushRemote();
  ref.onSnapshot(s => {   // progress made on another device arrives live

/* ---------- Flashcards ---------- */
function flashcards(app, words, header, kind, n) {
  let deck = words.slice(), i = 0, flipped = false, onlyNew = false;
  const build = () => { deck = onlyNew ? words.filter(w => !S.known[w.id]) : words.slice(); i = Math.min(i, Math.max(0, deck.length - 1)); };
  const render = () => {
    if (!deck.length) {
      app.innerHTML = header + `<div class="card empty"><h3>Nothing left to practise 🎉</h3>You know every word in this set.<div style="margin-top:16px;display:flex;gap:8px;justify-content:center"><button class="btn" id="showAll">Show all cards</button>${kind === 'day' ? `<a class="btn gold" href="#/day/${n}/quiz">Take the quiz</a>` : ''}</div></div>`;
      $('#showAll').onclick = () => { onlyNew = false; build(); render(); };
      return;
    }
    const w = deck[i], uzF = S.settings.uzFirst;
    app.innerHTML = header + `
    <div class="fc-wrap">
      <div class="fc-meta">
        <span>Card <b style="color:var(--ink)">${i + 1}</b> of ${deck.length}</span>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="chip ${onlyNew ? 'on' : ''}" id="onlyNew">Unknown only</button>
          <button class="chip ${uzF ? 'on' : ''}" id="uzFirst">Uzbek first</button>
          <button class="chip" id="shuf">${'Shuffle'}</button>
        </div>
      </div>
      <div class="flip ${flipped ? 'on' : ''}" id="flip">
        <div class="flip-in">
          <div class="face front">
            ${uzF ? `<div class="big" style="color:var(--gold2)">${esc(w.uz)}</div><div style="color:#c9cfdd;max-width:440px">${esc(w.def)}</div>`
                  : `<span class="pos">${esc(w.pos)}</span><div class="big">${esc(w.w)}</div>`}
            <div class="hint">Tap the card or press Space to flip</div>
          </div>
          <div class="face back">
            ${uzF ? `<span class="pos">${esc(w.pos)}</span><div class="big" style="font-family:var(--serif);font-size:34px;font-weight:600">${esc(w.w)}</div>` : `<div class="uzbig">${esc(w.uz)}</div><div class="def">${esc(w.def)}</div>`}
            <div class="ex">${highlight(w.ex, w.w)}</div>
            <button class="btn sm" id="say">${ICON.speak} Listen</button>
          </div>
        </div>
      </div>
      <div class="fc-acts">
        <button class="btn bad" id="no">Still learning <span class="kbd">1</span></button>
        <button class="btn good" id="yes">I know it <span class="kbd">2</span></button>
      </div>
      <div class="fc-acts" style="margin-top:10px">
        <button class="btn ghost sm" id="prev">${ICON.left} Previous</button>
        <button class="btn ghost sm" id="sayF">${ICON.speak} Listen</button>
        <button class="btn ghost sm" id="next">Next ${ICON.right}</button>
      </div>
      <div class="progress-dots">${deck.map((d, j) => `<i class="${S.known[d.id] ? 'k' : S.hard[d.id] ? 'h' : ''} ${j === i ? 'c' : ''}"></i>`).join('')}</div>
    </div>`;
    $('#flip').onclick = e => { if (e.target.closest('#say')) return; flipped = !flipped; $('#flip').classList.toggle('on', flipped); };
    $('#say').onclick = () => say(w, 'w');
    $('#sayF').onclick = () => say(w, 'w');
    $('#prev').onclick = () => go(-1);
    $('#next').onclick = () => go(1);
    $('#yes').onclick = () => mark(true);
    $('#no').onclick = () => mark(false);
    $('#onlyNew').onclick = () => { onlyNew = !onlyNew; i = 0; flipped = false; build(); render(); };
    $('#uzFirst').onclick = () => { S.settings.uzFirst = !S.settings.uzFirst; save(); flipped = false; render(); };
    $('#shuf').onclick = () => { deck = shuffle(deck); i = 0; flipped = false; render(); toast('Cards shuffled'); };
  };
  const go = d => { if (!deck.length) return; i = (i + d + deck.length) % deck.length; flipped = false; render(); };
  const mark = yes => {
    const w = deck[i];
    if (yes) setKnown(w.id, true); else { delete S.known[w.id]; setHard(w.id, true); }
    if (onlyNew && yes) { build(); flipped = false; render(); }
    else if (i === deck.length - 1) { flipped = false; render(); toast(`End of the deck · ${deck.filter(x => S.known[x.id]).length}/${deck.length} known`); }
    else go(1);
  };
  const key = e => {
    if (e.target.matches('input,select,textarea')) return;
    if (e.code === 'Space') { e.preventDefault(); const f = $('#flip'); if (f) { flipped = !flipped; f.classList.toggle('on', flipped); } }
    else if (e.key === 'ArrowRight') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === '1') mark(false);
    else if (e.key === '2') mark(true);
    else if (e.key.toLowerCase() === 's' && deck[i]) say(deck[i], 'w');
  };
  document.addEventListener('keydown', key);
  cleanup = () => document.removeEventListener('keydown', key);
  build(); render();
}

/* ---------- Quiz ---------- */
function quiz(app, words, header, dayN, opts = {}) {
  const pool = words;
  const distract = dayN ? ALL.slice(Math.max(0, (dayN - 3) * WPD), Math.min(ALL.length, (dayN + 2) * WPD)) : ALL;
  const types = ['en2uz', 'uz2en', 'def2en', 'ex2en'];
  const blank = w => {
    const base = w.w.replace(/[?.!]$/, '');
    const re = new RegExp(base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '[a-z]*', 'i');
    return re.test(w.ex) ? w.ex.replace(re, '_____') : null;
  };
  const make = list => shuffle(list).map(w => {
    let t = types[Math.floor(Math.random() * types.length)];
    if (t === 'ex2en' && !blank(w)) t = 'def2en';
    const field = t === 'en2uz' ? 'uz' : 'w';
    const others = shuffle(distract.filter(o => o.id !== w.id && norm(o[field]) !== norm(w[field])));
    const seen = new Set([norm(w[field])]); const picks = [];
    for (const o of others) { if (!seen.has(norm(o[field]))) { seen.add(norm(o[field])); picks.push(o); } if (picks.length === 3) break; }
    return { w, t, field, options: shuffle([w, ...picks]) };
  });
  let qs = make(pool), qi = 0, score = 0, answered = false, wrong = [];
  const LBL = { en2uz: 'Choose the Uzbek meaning', uz2en: 'Choose the English word', def2en: 'Which word matches this definition?', ex2en: 'Complete the sentence' };
  const render = () => {
    if (qi >= qs.length) return finish();
    const q = qs[qi];
    const prompt = q.t === 'en2uz' ? `<div class="qprompt">${esc(q.w.w)}</div><span class="pos">${esc(q.w.pos)}</span>`
      : q.t === 'uz2en' ? `<div class="qprompt">${esc(q.w.uz)}</div><span class="pos">${esc(q.w.pos)}</span>`
      : q.t === 'def2en' ? `<div class="qprompt small">“${esc(q.w.def)}”</div><span class="pos">${esc(q.w.pos)}</span>`
      : `<div class="qprompt small">${esc(blank(q.w))}</div>`;
    app.innerHTML = header + `
    <div class="quiz">
      <div class="fc-meta"><span>Question <b style="color:var(--ink)">${qi + 1}</b> of ${qs.length}</span><span>Score: <b style="color:var(--ink)" id="qscore">${score}</b></span></div>
      <div class="qbar"><i style="width:${qi / qs.length * 100}%"></i></div>
      <div class="card qcard">
        <div class="qtype">${LBL[q.t]}</div>
        ${prompt}
        <div class="opts">${q.options.map((o, j) => `<button class="opt" data-j="${j}"><span class="k">${j + 1}</span><span>${esc(o[q.field])}</span></button>`).join('')}</div>
        <div id="fb"></div>
      </div>
    </div>`;
    answered = false;
    app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.j));
  };
  const answer = j => {
    if (answered) return; answered = true;
    const q = qs[qi], ok = q.options[j].id === q.w.id;
    const btns = app.querySelectorAll('.opt');
    btns.forEach((b, k) => { b.disabled = true; if (q.options[k].id === q.w.id) b.classList.add('right'); });
    if (ok) { score++; $('#qscore').textContent = score; setKnown(q.w.id, true); } else { btns[j].classList.add('wrong'); wrong.push(q.w); delete S.known[q.w.id]; setHard(q.w.id, true); }
    $('#fb').innerHTML = `<div class="feedback"><b>${ok ? '✓ Correct!' : '✗ Not quite.'}</b> <b>${esc(q.w.w)}</b> = ${esc(q.w.uz)}<div class="muted" style="margin-top:4px;font-style:italic">${esc(q.w.ex)}</div>
      <div style="margin-top:12px;display:flex;gap:8px"><button class="btn primary sm" id="nx">${qi + 1 < qs.length ? 'Next question' : 'See results'} <span class="kbd">Enter</span></button><button class="btn sm" id="sp">${ICON.speak}</button></div></div>`;
    $('#nx').onclick = () => { qi++; render(); };
    $('#sp').onclick = () => say(q.w, 'w');
    if (ok) say(q.w, 'w');
  };
  const finish = () => {
    const pct = Math.round(score / qs.length * 100);
    if (dayN && !opts.retry) {
      S.best[dayN] = Math.max(S.best[dayN] || 0, pct);
      if (pct >= 80) S.done[dayN] = today();
      save();
    }
    const passed = pct >= 80;
    app.innerHTML = header + `
    <div class="quiz"><div class="card result">
      <div class="eyebrow">${dayN ? (passed ? 'Day complete' : 'Keep practising') : 'Review complete'}</div>
      <div class="score" style="margin:10px 0">${pct}%</div>
      <div class="muted">${score} of ${qs.length} correct${dayN ? (passed ? ' · Day ' + dayN + ' is marked as completed ✓' : ' · Score 80% or more to complete this day') : ''}</div>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap">
        ${wrong.length ? '<button class="btn primary" id="retryWrong">Retry the ' + wrong.length + ' you missed</button>' : ''}
        <button class="btn" id="again">New quiz</button>
        ${dayN && dayN < 100 ? `<a class="btn gold" href="#/day/${dayN + 1}">Go to Day ${dayN + 1} →</a>` : ''}
      </div>
      ${wrong.length ? `<div class="missed"><div class="eyebrow" style="padding:0;background:none;border:0">Words to review (starred)</div>${wrong.map(w => `<div><b>${esc(w.w)}</b> · ${esc(w.uz)} <span class="muted">· ${esc(w.def)}</span></div>`).join('')}</div>` : ''}
    </div></div>`;
    const rw = $('#retryWrong'); if (rw) rw.onclick = () => { opts.retry = true; qs = make(wrong); wrong = []; qi = 0; score = 0; render(); };
    $('#again').onclick = () => { opts.retry = false; qs = make(pool); wrong = []; qi = 0; score = 0; render(); };
  };
  const key = e => {
    if (e.target.matches('input,select,textarea')) return;
    if (/^[1-4]$/.test(e.key) && !answered && qi < qs.length) answer(+e.key - 1);
    else if (e.key === 'Enter' && answered && $('#nx')) { qi++; render(); }
  };
  document.addEventListener('keydown', key);
  cleanup = () => document.removeEventListener('keydown', key);
  render();
}

/* ---------- Spelling ---------- */
function spelling(app, words, header) {
  let list = shuffle(words), i = 0, score = 0, tries = 0, hint = 0, state = 'ask';
  const render = () => {
    if (i >= list.length) {
      app.innerHTML = header + `<div class="quiz"><div class="card result"><div class="eyebrow">Spelling complete</div><div class="score" style="margin:10px 0">${score}/${list.length}</div><div class="muted">correct on the first try</div><div style="margin-top:20px"><button class="btn primary" id="again">Practise again</button></div></div></div>`;
      $('#again').onclick = () => { list = shuffle(words); i = 0; score = 0; render(); };
      return;
    }
    const w = list[i];
    app.innerHTML = header + `
    <div class="quiz spell">
      <div class="fc-meta"><span>Word <b style="color:var(--ink)">${i + 1}</b> of ${list.length}</span><span>Score: <b style="color:var(--ink)">${score}</b></span></div>
      <div class="qbar"><i style="width:${i / list.length * 100}%"></i></div>
      <div class="card qcard">
        <div class="qtype">Type the English word</div>
        <div class="qprompt">${esc(w.uz)}</div>
        <div class="muted" style="margin-bottom:16px">${esc(w.def)} <span class="pos">${esc(w.pos)}</span></div>
        <input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${hint ? esc(w.w.slice(0, hint)) + '…' : 'Type here and press Enter'}">
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
          <button class="btn primary" id="chk">Check</button>
          <button class="btn" id="hearIt">${ICON.speak} Hear it</button>
          <button class="btn" id="hint">Hint</button>
          <button class="btn ghost" id="skip">Show answer</button>
        </div>
        <div id="fb"></div>
      </div>
    </div>`;
    const inp = $('#inp'); inp.focus();
    const check = () => {
      if (state === 'done') { next(); return; }
      if (!inp.value.trim()) return;
      if (spellKey(inp.value) === spellKey(w.w)) {
        inp.className = 'right'; if (tries === 0 && hint === 0) { score++; setKnown(w.id, true); }
        say(w, 'w'); state = 'done';
        $('#fb').innerHTML = `<div class="feedback"><b>✓ Correct!</b> ${esc(w.ex)}<div style="margin-top:10px"><button class="btn primary sm" id="nx">Next <span class="kbd">Enter</span></button></div></div>`;
        $('#nx').onclick = next;
      } else {
        tries++; inp.className = 'wrong';
        if (tries === 1) setHard(w.id, true);
        $('#fb').innerHTML = `<div class="feedback">Not quite, try again. Use <b>Hint</b> or <b>Hear it</b> if you're stuck.</div>`;
      }
    };
    $('#chk').onclick = check;
    inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); check(); } };
    $('#hearIt').onclick = () => { say(w, 'w'); inp.focus(); };
    $('#hint').onclick = () => { hint = Math.min(w.w.length, hint + 1); inp.placeholder = w.w.slice(0, hint) + '…'; inp.focus(); };
    $('#skip').onclick = () => { setHard(w.id, true); state = 'done'; inp.value = w.w; inp.className = 'wrong'; say(w, 'w');
      $('#fb').innerHTML = `<div class="feedback">The answer is <b>${esc(w.w)}</b>. It's starred for review.<div style="margin-top:10px"><button class="btn primary sm" id="nx">Next <span class="kbd">Enter</span></button></div></div>`; $('#nx').onclick = next; inp.focus(); };
  };
  const next = () => { i++; tries = 0; hint = 0; state = 'ask'; render(); };
  render();
}

/* ---------- Review ---------- */
function viewReview(app, mode) {
  const hard = ALL.filter(w => S.hard[w.id]);
  const doneWords = ALL.filter(w => S.done[w.day] || S.known[w.id]);
  const header = `
    <div class="section-head"><div><div class="eyebrow">Spaced repetition</div><h1>Review</h1>
    <div class="muted" style="margin-top:6px">Starred words are the ones you missed or starred. Review them every day.</div></div></div>
    <div class="tabs">
      <a href="#/review" class="${!mode ? 'on' : ''}">Starred (${hard.length})</a>
      <a href="#/review/cards" class="${mode === 'cards' ? 'on' : ''}">Flashcards</a>
      <a href="#/review/quiz" class="${mode === 'quiz' ? 'on' : ''}">Mixed quiz</a>
    </div>`;
  if (mode === 'cards') {
    if (!hard.length) { app.innerHTML = header + emptyReview(); return; }
    return flashcards(app, hard, header, 'review');
  }
  if (mode === 'quiz') {
    const src = hard.length >= 4 ? shuffle(hard.concat(shuffle(doneWords).slice(0, Math.max(0, 20 - hard.length)))).slice(0, 20) : shuffle(doneWords).slice(0, 20);
    if (src.length < 4) { app.innerHTML = header + `<div class="card empty"><h3>Not enough words yet</h3>Learn at least one day of words, then come back for a mixed review quiz.<div style="margin-top:16px"><a class="btn gold" href="#/day/${nextDay()}">Go to Day ${nextDay()}</a></div></div>`; return; }
    return quiz(app, src, header, null);
  }
  const render = () => {
    const list = ALL.filter(w => S.hard[w.id]);
    app.innerHTML = header + (list.length ? `
      <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap"><a class="btn primary" href="#/review/cards">Practise with flashcards</a><a class="btn gold" href="#/review/quiz">Mixed quiz</a></div>
      <div class="words" id="words">${list.map(w => wordCard(w)).join('')}</div>` : emptyReview());
    const ws = $('#words'); if (ws) bindWordCards(ws, render);
  };
  render();
}
const emptyReview = () => `<div class="card empty"><h3>No starred words</h3>Words you miss in quizzes, or star with ☆, will appear here.<div style="margin-top:16px"><a class="btn gold" href="#/day/${nextDay()}">Continue Day ${nextDay()}</a></div></div>`;

/* ---------- Search ---------- */
let lastQ = '';
function viewSearch(app) {
  app.innerHTML = `
    <div class="section-head"><div><div class="eyebrow">All 3,000 words</div><h1>Search</h1></div></div>
    <div class="card search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" placeholder="Search in English or Uzbek…" value="${esc(lastQ)}" autocomplete="off"></div>
    <div class="list" id="res"></div>`;
  const q = $('#q'), res = $('#res');
  const run = () => {
    lastQ = q.value; const s = norm(q.value);
    if (!s) { res.innerHTML = `<div class="muted" style="text-align:center;padding:24px">Type a word, e.g. <i>boarding</i>, <i>chegirma</i>, <i>diamond</i></div>`; return; }
    const hits = ALL.filter(w => norm(w.w).includes(s) || norm(w.uz).includes(s)).sort((a, b) => (norm(a.w).startsWith(s) ? 0 : 1) - (norm(b.w).startsWith(s) ? 0 : 1)).slice(0, 80);
    res.innerHTML = hits.length ? hits.map(w => `
      <div class="card li" data-id="${w.id}">
        <button class="icon-btn" data-a="speak">${ICON.speak}</button>
        <div class="meta"><span class="en">${esc(w.w)}</span> <span class="pos">${esc(w.pos)}</span> <b class="uz" style="font-size:14px;margin-left:4px">${esc(w.uz)}</b><div>${esc(w.def)}</div></div>
        <a class="daylink" href="#/day/${w.day}">Day ${w.day} →</a>
      </div>`).join('') : `<div class="card empty"><h3>No matches</h3>Try a shorter word.</div>`;
  };
  res.onclick = e => { const b = e.target.closest('[data-a="speak"]'); if (b) say(ALL[+b.closest('[data-id]').dataset.id], 'w'); };
  q.oninput = run; run(); q.focus();
}

/* ---------- Settings ---------- */
/* ---------- Offline app (web link only: service workers need https) ---------- */
const CAN_OFFLINE = 'serviceWorker' in navigator && location.protocol === 'https:' && 'caches' in window;
if (CAN_OFFLINE) navigator.serviceWorker.register('sw.js').catch(() => {});
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isInstalled = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const packUrl = d => new URL('audio/d' + String(d).padStart(3, '0') + '.js', location.href).href;
let offlineCount = null, offlineBusy = false;
async function countOffline() {
  if (!CAN_OFFLINE) return null;
  try {
    const c = await caches.open('se100-audio');
    let n = 0;
    for (let d = 1; d <= 100; d++) if (await c.match(packUrl(d), { ignoreVary: true, ignoreSearch: true })) n++;
    return n;
  } catch (e) { return null; }
}
function offlineSection() {
  if (!CAN_OFFLINE) return '';
  const n = offlineCount;
  const install = isIOS && !isInstalled()
    ? `<div class="setting"><div><b>Add to your Home Screen</b><span>In Safari, tap <b style="display:inline;font-size:inherit">Share</b> → <b style="display:inline;font-size:inherit">Add to Home Screen</b>. It then opens like an app and keeps your progress safe.</span></div></div>` : '';
  return `
    <h2 class="mt" style="margin-bottom:12px">Use offline</h2>
    <div class="card">
      ${install}
      <div class="setting"><div><b>Recordings saved on this device</b><span>${n == null ? 'Checking…' : n + ' of 100 days. Each day is saved automatically when you open it'}</span></div>
        <button class="btn sm" id="offAll" ${offlineBusy || n === 100 ? 'disabled' : ''}>${offlineBusy ? 'Saving…' : n === 100 ? 'All saved ✓' : 'Save all (63 MB)'}</button></div>
    </div>`;
}
function bindOffline(render) {
  if (!CAN_OFFLINE) return;
  if (offlineCount == null) countOffline().then(n => { offlineCount = n; if (location.hash === '#/settings') render(); });
  const b = $('#offAll'); if (!b) return;
  b.onclick = async () => {
    if (offlineBusy) return;
    offlineBusy = true; b.disabled = true;
    try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
    try {
      const c = await caches.open('se100-audio');
      let n = 0;
      for (let d = 1; d <= 100; d++) {
        const u = packUrl(d);
        if (!(await c.match(u, { ignoreVary: true, ignoreSearch: true }))) {
          const r = await fetch(u, { cache: 'no-store' });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          await c.put(u, r);
        }
        n++;
        if ($('#offAll')) $('#offAll').textContent = `Saving… ${n}/100`;
      }
      offlineCount = 100; toast('All recordings saved for offline use');
    } catch (e) {
      offlineCount = await countOffline();
      toast('Saving stopped. Check your internet connection and try again');
    }
    offlineBusy = false;
    if (location.hash === '#/settings') render();
  };
}

function viewSettings(app) {

    const group = (title, list) => list.length ? `<optgroup label="${title}">${list.map(v => `<option value="${esc(v.name)}" ${st.voice === v.name ? 'selected' : ''}>${label(v)}</option>`).join('')}</optgroup>` : '';
    const tip = nat.length
      ? (navigator.onLine ? '' : `<div class="feedback" style="margin:0 18px 16px">You're offline, so the natural AI voices are paused. A built-in voice is used until you reconnect.</div>`)
      : `<div class="feedback" style="margin:0 18px 16px"><b>Want a more human voice?</b> Open this site in <b>Microsoft Edge</b> (already on Windows): right-click <b>index.html</b> → <b>Open with</b> → <b>Microsoft Edge</b>. Edge adds free, natural-sounding AI voices such as Sonia and Ryan (British) and Ava and Andrew (American). They need an internet connection.</div>`;
    app.innerHTML = `
    <div class="section-head"><div><div class="eyebrow">Preferences</div><h1>Settings</h1></div></div>
    <div class="card">
      <div class="setting"><div><b>Show Uzbek translations</b><span>Hide them to test yourself in Learn mode</span></div><button class="switch ${st.showUz ? 'on' : ''}" id="sUz" aria-label="Show Uzbek"></button></div>
      <div class="setting"><div><b>Flashcards: Uzbek first</b><span>See the Uzbek side first and recall the English word</span></div><button class="switch ${st.uzFirst ? 'on' : ''}" id="sUzF" aria-label="Uzbek first"></button></div>
      <div class="setting"><div><b>Recorded AI voice</b><span>${packsMissing ? 'Recordings not found next to this page, so a browser voice is used' : 'A natural British voice (Emma) recorded for every word and example. Works on any phone or browser'}</span></div><button class="switch ${st.recorded ? 'on' : ''}" id="sRec" aria-label="Recorded AI voice"></button></div>
      <div class="setting"><div><b>Pronunciation accent</b><span>For the browser voice, used when recordings are off or missing</span></div>
        <select id="sAcc"><option value="en-GB" ${st.accent === 'en-GB' ? 'selected' : ''}>British (en-GB)</option><option value="en-US" ${st.accent === 'en-US' ? 'selected' : ''}>American (en-US)</option></select></div>
      <div class="setting"><div><b>Voice</b><span>${cur ? `Now using <b style="display:inline;font-size:inherit">${label(cur)}</b>${isNatural(cur) ? ' · natural AI voice ✨' : cur.localService ? ' · built-in, works offline' : ''}` : 'No English voices found on this device'}</span></div>
        <select id="sVoice" style="max-width:220px"><option value="">Automatic (most natural)</option>${group('Natural AI voices · need internet', nat)}${group('Built-in · work offline', en.filter(v => !isNatural(v) && v.localService))}${group('Other online voices', en.filter(v => !isNatural(v) && !v.localService))}</select></div>
      ${tip}
      <div class="setting"><div><b>Speaking speed</b><span>How fast words are read aloud</span></div>
        <select id="sRate">${[[0.7, 'Slow'], [0.9, 'Normal'], [1.1, 'Fast']].map(([v, l]) => `<option value="${v}" ${st.rate == v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div class="setting"><div><b>Appearance</b><span>Light, dark or match your device</span></div>
        <select id="sTheme">${[['auto', 'Automatic'], ['light', 'Light'], ['dark', 'Dark']].map(([v, l]) => `<option value="${v}" ${st.theme === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
      <div class="setting"><div><b>Test pronunciation</b><span>Plays an example sentence</span></div><button class="btn sm" id="sTest">${ICON.speak} Play</button></div>
    </div>
    ${offlineSection()}
    <h2 class="mt" style="margin-bottom:12px">Your progress</h2>
    <div class="card">
      <div class="setting"><div><b>Where progress is saved</b><span>${sync.on ? 'In your Claude account, so it stays in step on your phone and computer ✓' : 'On this device. To move it to another device, use Export here and Import there'}</span></div></div>
      <div class="setting"><div><b>Back up progress</b><span>Save a file you can load on another device or browser</span></div><button class="btn sm" id="exp">Export</button></div>
      <div class="setting"><div><b>Restore progress</b><span>Load a backup file you exported earlier</span></div><label class="btn sm">Import<input type="file" id="imp" accept=".json,application/json" hidden></label></div>
      <div class="setting"><div><b>Reset everything</b><span>Clears known words, stars, streak and completed days</span></div><button class="btn sm bad" id="reset">Reset</button></div>
    </div>
    <div class="footer">Service English 100 · 3,000 words · 100 days · Works offline</div>`;
    $('#sUz').onclick = () => { st.showUz = !st.showUz; save(); render(); };
    $('#sUzF').onclick = () => { st.uzFirst = !st.uzFirst; save(); render(); };
    $('#sRec').onclick = () => { st.recorded = !st.recorded; save(); render(); say(ALL[0], 'e'); };
    $('#sAcc').onchange = e => { st.accent = e.target.value; save(); render(); };
    $('#sVoice').onchange = e => { st.voice = e.target.value; save(); render(); speak('Welcome aboard. May I see your boarding pass, please?'); };
    $('#sRate').onchange = e => { st.rate = +e.target.value; save(); };
    $('#sTheme').onchange = e => { st.theme = e.target.value; save(); applyTheme(); };
    $('#sTest').onclick = () => say(ALL[0], 'e');
    bindOffline(render);
    $('#exp').onclick = async () => {
      const json = JSON.stringify(S, null, 1), filename = 'service-english-100-progress.json';
      // On claude.ai, files are saved through the viewer's own download prompt.
      const dl = window.claude && typeof claude.use === 'function' ? await claude.use('downloads') : null;
      if (dl) {
        try { await dl.save({ filename, data: json }); toast('Backup saved'); }
        catch (e) { if (!e || e.code !== 'declined') toast('Saving files isn’t available here'); }
        return;
      }
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = filename; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
    $('#imp').onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => { try { const s = JSON.parse(r.result); if (!s.known) throw 0; S = { ...DEFAULT, ...s, settings: { ...DEFAULT.settings, ...(s.settings || {}) } }; save(); applyTheme(); toast('Progress restored'); render(); } catch (err) { toast('That file is not a valid backup'); } };
      r.readAsText(f);
    };
    // Two taps instead of confirm(), which claude.ai pages can't show.
    $('#reset').onclick = e => {
      const b = e.currentTarget;
      if (!b.dataset.armed) {
        b.dataset.armed = '1'; b.textContent = 'Tap again to reset';
        setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = 'Reset'; } }, 4000);
        return;
      }
      const keep = S.settings; S = JSON.parse(JSON.stringify(DEFAULT)); S.settings = keep; save(); toast('Progress reset'); render();
    };
  };
  render();
  if ('speechSynthesis' in window && !voices.length) setTimeout(() => { loadVoices(); if (location.hash.includes('settings')) render(); }, 500);
}

route();
initSync();
</script>
</body>
</html>
